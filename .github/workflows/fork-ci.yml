name: Fork CI (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to test
        required: true
        default: agent/structured-source-locations

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  node:
    name: Node bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node
      - name: Committed bindings are up to date
        run: git diff --exit-code -- node/index.js node/index.d.ts

  wasm:
    name: Wasm bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - run: cargo clippy -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install wasm-pack 0.15.0
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      - run: wasm-pack build wasm --release --target web --scope firecrawl
      - run: node --test wasm/test.mjs

  python:
    name: Python bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install maturin
      - run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - run: pip install --no-index --find-links dist firecrawl-anydoc
      - run: python -m unittest discover -s python/tests

name: Fork CI (self-hosted)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to test
        required: true
        default: agent/structured-source-locations

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full validation
    runs-on: [self-hosted, linux, x64, anydoc-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record tested commit
        run: git rev-parse HEAD

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked

      - name: Regenerate source-location fixtures
        run: |
          python tests/gen_source_location_fixtures.py
          git diff --exit-code -- tests/source-location-fixtures

      - name: Install Node dependencies
        run: npm ci
        working-directory: node

      - name: Build Node bindings
        run: npm run build
        working-directory: node

      - name: Test Node bindings
        run: npm test
        working-directory: node

      - name: Committed Node bindings are up to date
        run: git diff --exit-code -- node/index.js node/index.d.ts

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build Python wheel
        run: >
          maturin build --release --locked --manifest-path python/Cargo.toml
          --out "$RUNNER_TEMP/anydoc-dist"

      - name: Install Python wheel
        run: >
          python -m pip install --no-index --find-links "$RUNNER_TEMP/anydoc-dist"
          firecrawl-anydoc

      - name: Test Python bindings
        run: python -m unittest discover -s python/tests

      - name: WASM clippy
        run: cargo clippy -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack 0.15.0
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"

      - name: Build WASM bindings
        run: wasm-pack build wasm --release --target web --scope firecrawl

      - name: Test WASM bindings
        run: node --test wasm/test.mjs

      - name: Final tracked-tree check
        run: git diff --exit-code
